<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顺忆 - 让记忆永不褪色</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #7C9A92;
      --color-secondary: #F5E6D3;
      --color-accent: #D4A574;
      --color-background: #FDFBF7;
      --color-text: #3D3D3D;
      --color-text-secondary: #8A8A8A;
      --shadow-card: 0 4px 20px rgba(124, 154, 146, 0.15);
      --shadow-hover: 0 8px 32px rgba(124, 154, 146, 0.25);
      --radius-card: 16px;
      --radius-button: 24px;
      --radius-image: 12px;
      --transition: 0.3s ease-out;
      --font-serif: 'Noto Serif SC', serif;
      --font-sans: 'Noto Sans SC', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-background);
      color: var(--color-text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(253, 251, 247, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid rgba(124, 154, 146, 0.1);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-text {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 4px;
    }

    .logo-pinyin {
      font-size: 10px;
      color: var(--color-text-secondary);
      letter-spacing: 2px;
    }

    .add-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), #5A7A72);
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .add-btn:hover {
      transform: scale(1.1);
      box-shadow: var(--shadow-hover);
    }

    /* 主内容区 */
    .main {
      padding-top: 60px;
      min-height: 100vh;
    }

    /* 英雄区 */
    .hero {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124, 154, 146, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .hero-subtitle {
      font-size: clamp(16px, 4vw, 20px);
      color: var(--color-text-secondary);
      font-weight: 300;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.2s forwards;
    }

    /* 漂浮装饰 */
    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      opacity: 0.4;
      animation: float 6s ease-in-out infinite;
    }

    .float-item:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .float-item:nth-child(2) { left: 85%; top: 30%; animation-delay: 1s; }
    .float-item:nth-child(3) { left: 20%; top: 70%; animation-delay: 2s; }
    .float-item:nth-child(4) { left: 75%; top: 60%; animation-delay: 3s; }
    .float-item:nth-child(5) { left: 50%; top: 80%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      animation: bounce 2s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    /* 记忆卡片流 */
    .memories-section {
      padding: 48px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .memories-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .memories-title {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .memories-count {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .memories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    @media (max-width: 768px) {
      .memories-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (min-width: 1024px) {
      .memories-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* 记忆卡片 */
    .memory-card {
      background: white;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      opacity: 0;
      animation: cardFadeIn 0.5s ease-out forwards;
    }

    .memory-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: linear-gradient(135deg, var(--color-secondary), var(--color-primary));
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-excerpt {
      font-size: 14px;
      color: var(--color-text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .card-date {
      font-size: 12px;
      color: var(--color-accent);
      font-weight: 500;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 80px 24px;
      display: none;
    }

    .empty-state.active {
      display: block;
    }

    .empty-illustration {
      width: 280px;
      height: 200px;
      margin: 0 auto 32px;
      position: relative;
    }

    .empty-illustration svg {
      width: 100%;
      height: 100%;
    }

    .empty-text {
      font-size: 16px;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }

    .empty-btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, var(--color-primary), #5A7A72);
      color: white;
      border: none;
      border-radius: var(--radius-button);
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
    }

    .empty-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-hover);
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(253, 251, 247, 0.9);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-hover);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid rgba(124, 154, 146, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 24px;
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: 50%;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--color-secondary);
      color: var(--color-text);
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 8px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(124, 154, 146, 0.3);
      border-radius: 12px;
      font-size: 16px;
      font-family: var(--font-sans);
      transition: var(--transition);
      background: var(--color-background);
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(124, 154, 146, 0.1);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .image-upload {
      border: 2px dashed rgba(124, 154, 146, 0.3);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .image-upload:hover {
      border-color: var(--color-primary);
      background: rgba(124, 154, 146, 0.05);
    }

    .image-upload-icon {
      font-size: 32px;
      color: var(--color-primary);
      margin-bottom: 8px;
    }

    .image-upload-text {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .image-preview {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .preview-item {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      position: relative;
    }

    .preview-remove {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff6b6b;
      color: white;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(124, 154, 146, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: var(--radius-button);
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text-secondary);
      border: 1px solid rgba(124, 154, 146, 0.3);
    }

    .btn-secondary:hover {
      background: var(--color-secondary);
      color: var(--color-text);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary), #5A7A72);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-card);
    }

    .btn-danger {
      background: #ff6b6b;
      color: white;
    }

    .btn-danger:hover {
      background: #ff5252;
    }

    /* 详情弹窗 */
    .detail-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: var(--radius-image);
    }

    .detail-content {
      padding: 0;
    }

    .detail-header {
      padding: 24px 24px 0;
    }

    .detail-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .detail-date {
      font-size: 14px;
      color: var(--color-accent);
      font-weight: 500;
    }

    .detail-body {
      padding: 16px 24px 24px;
    }

    .detail-text {
      font-size: 16px;
      line-height: 1.8;
      color: var(--color-text);
    }

    .detail-images {
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .detail-images img {
      max-width: 150px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .detail-images img:hover {
      transform: scale(1.05);
    }

    .detail-actions {
      padding: 16px 24px;
      border-top: 1px solid rgba(124, 154, 146, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    /* 图片查看器 */
    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .image-viewer.active {
      display: flex;
    }

    .image-viewer img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .image-viewer-close {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 24px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* 页脚 */
    .footer {
      text-align: center;
      padding: 48px 24px;
      color: var(--color-text-secondary);
      font-size: 14px;
    }

    .footer-heart {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-text">顺忆</span>
      <span class="logo-pinyin">SHUNYI</span>
    </div>
    <button class="add-btn" id="addBtn" title="添加记忆">+</button>
  </nav>

  <!-- 主内容区 -->
  <main class="main">
    <!-- 英雄区 -->
    <section class="hero">
      <div class="floating-elements">
        <div class="float-item">✿</div>
        <div class="float-item">❀</div>
        <div class="float-item">♧</div>
        <div class="float-item">❋</div>
        <div class="float-item">✾</div>
      </div>
      <h1 class="hero-title">让记忆永不褪色</h1>
      <p class="hero-subtitle">每一次回望，都是一次与过去的温柔重逢</p>
      <div class="scroll-hint">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
      </div>
    </section>

    <!-- 记忆卡片区 -->
    <section class="memories-section">
      <div class="memories-header">
        <h2 class="memories-title">我的记忆</h2>
        <p class="memories-count" id="memoriesCount">0 段记忆</p>
      </div>

      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-illustration">
          <svg viewBox="0 0 280 200" fill="none">
            <!-- 夜空 -->
            <rect width="280" height="200" fill="#FDFBF7"/>
            <!-- 星星 -->
            <circle cx="60" cy="40" r="2" fill="#D4A574" opacity="0.8"/>
            <circle cx="120" cy="25" r="1.5" fill="#D4A574" opacity="0.6"/>
            <circle cx="200" cy="50" r="2" fill="#D4A574" opacity="0.7"/>
            <circle cx="240" cy="30" r="1" fill="#D4A574" opacity="0.5"/>
            <circle cx="80" cy="60" r="1.5" fill="#D4A574" opacity="0.6"/>
            <!-- 月亮 -->
            <circle cx="220" cy="45" r="20" fill="#F5E6D3"/>
            <circle cx="210" cy="45" r="18" fill="#FDFBF7"/>
            <!-- 草地 -->
            <ellipse cx="140" cy="200" rx="160" ry="60" fill="#7C9A92" opacity="0.3"/>
            <ellipse cx="140" cy="195" rx="140" ry="50" fill="#7C9A92" opacity="0.4"/>
            <!-- 女孩剪影 -->
            <ellipse cx="140" cy="170" rx="25" ry="8" fill="#7C9A92" opacity="0.5"/>
            <circle cx="140" cy="120" r="20" fill="#7C9A92" opacity="0.6"/>
            <path d="M140 140 Q120 160 110 180 L170 180 Q160 160 140 140" fill="#7C9A92" opacity="0.6"/>
            <!-- 飘落的叶子 -->
            <text x="180" y="100" font-size="20" fill="#7C9A92" opacity="0.5">✿</text>
            <text x="100" y="90" font-size="16" fill="#7C9A92" opacity="0.4">❀</text>
          </svg>
        </div>
        <p class="empty-text">还没有记忆，开启你的第一条回忆吧</p>
        <button class="empty-btn" id="emptyAddBtn">添加记忆</button>
      </div>

      <!-- 卡片流 -->
      <div class="memories-grid" id="memoriesGrid"></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>用<span class="footer-heart">♥</span>守护每一份珍贵记忆</p>
  </footer>

  <!-- 添加/编辑记忆弹窗 -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="formModalTitle">添加记忆</h3>
        <button class="modal-close" id="formModalClose">×</button>
      </div>
      <div class="modal-body">
        <form id="memoryForm">
          <input type="hidden" id="memoryId">
          <div class="form-group">
            <label class="form-label">标题 *</label>
            <input type="text" class="form-input" id="memoryTitle" maxlength="50" placeholder="给这段记忆起个名字" required>
          </div>
          <div class="form-group">
            <label class="form-label">日期 *</label>
            <input type="date" class="form-input" id="memoryDate" required>
          </div>
          <div class="form-group">
            <label class="form-label">图片（可选，最多9张）</label>
            <div class="image-upload" id="imageUpload">
              <div class="image-upload-icon">📷</div>
              <div class="image-upload-text">点击或拖拽上传图片</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" multiple hidden>
            <div class="image-preview" id="imagePreview"></div>
          </div>
          <div class="form-group">
            <label class="form-label">内容 *</label>
            <textarea class="form-textarea" id="memoryContent" maxlength="2000" placeholder="记录这段记忆的详细内容..." required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="formCancelBtn">取消</button>
        <button type="button" class="btn btn-primary" id="formSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 查看详情弹窗 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">记忆详情</h3>
        <button class="modal-close" id="detailModalClose">×</button>
      </div>
      <div class="detail-content" id="detailContent"></div>
    </div>
  </div>

  <!-- 图片查看器 -->
  <div class="image-viewer" id="imageViewer">
    <button class="image-viewer-close" id="imageViewerClose">×</button>
    <img id="viewerImage" src="" alt="">
  </div>

  <script>
    // 生成UUID
    function generateId() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // 格式化日期
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      return `${year}年${month}月${day}日`;
    }

    // 本地存储键名
    const STORAGE_KEY = 'shunyi_memories';

    // 状态
    let memories = [];
    let currentImages = [];
    let editingId = null;

    // 加载记忆
    function loadMemories() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        memories = JSON.parse(data);
      }
      renderMemories();
    }

    // 保存记忆
    function saveMemories() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
    }

    // 渲染记忆卡片
    function renderMemories() {
      const grid = document.getElementById('memoriesGrid');
      const emptyState = document.getElementById('emptyState');
      const countEl = document.getElementById('memoriesCount');

      // 更新计数
      countEl.textContent = `${memories.length} 段记忆`;

      // 显示空状态或卡片
      if (memories.length === 0) {
        emptyState.classList.add('active');
        grid.innerHTML = '';
        return;
      }

      emptyState.classList.remove('active');

      // 按时间倒序
      const sorted = [...memories].sort((a, b) => new Date(b.date) - new Date(a.date));

      grid.innerHTML = sorted.map((memory, index) => {
        const excerpt = memory.content.length > 60 
          ? memory.content.substring(0, 60) + '...' 
          : memory.content;
        
        return `
          <div class="memory-card" data-id="${memory.id}" style="animation-delay: ${index * 0.1}s">
            ${memory.images && memory.images.length > 0 
              ? `<img class="card-image" src="${memory.images[0]}" alt="${memory.title}">`
              : `<div class="card-image" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(124,154,146,0.3);">✿</div>`
            }
            <div class="card-content">
              <h3 class="card-title">${memory.title}</h3>
              <p class="card-excerpt">${excerpt}</p>
              <span class="card-date">${formatDate(memory.date)}</span>
            </div>
          </div>
        `;
      }).join('');

      // 绑定点击事件
      grid.querySelectorAll('.memory-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const memory = memories.find(m => m.id === id);
          if (memory) showDetail(memory);
        });
      });
    }

    // 显示详情
    function showDetail(memory) {
      const detailContent = document.getElementById('detailContent');
      
      let imagesHtml = '';
      if (memory.images && memory.images.length > 0) {
        imagesHtml = `
          <div class="detail-images">
            ${memory.images.map((img, i) => `<img src="${img}" alt="记忆图片${i+1}" data-index="${i}">`).join('')}
          </div>
        `;
      }

      detailContent.innerHTML = `
        ${memory.images && memory.images.length > 0 
          ? `<img class="detail-image" src="${memory.images[0]}" alt="${memory.title}">`
          : ''
        }
        <div class="detail-header">
          <h2 class="detail-title">${memory.title}</h2>
          <span class="detail-date">${formatDate(memory.date)}</span>
        </div>
        <div class="detail-body">
          <p class="detail-text">${memory.content.replace(/\n/g, '<br>')}</p>
        </div>
        ${imagesHtml}
        <div class="detail-actions">
          <button class="btn btn-secondary" id="editMemoryBtn">编辑</button>
          <button class="btn btn-danger" id="deleteMemoryBtn">删除</button>
        </div>
      `;

      // 绑定事件
      document.getElementById('editMemoryBtn').onclick = () => {
        closeDetail();
        setTimeout(() => openForm(memory), 300);
      };

      document.getElementById('deleteMemoryBtn').onclick = () => {
        if (confirm('确定要删除这段记忆吗？')) {
          memories = memories.filter(m => m.id !== memory.id);
          saveMemories();
          renderMemories();
          closeDetail();
        }
      };

      // 图片点击放大
      detailContent.querySelectorAll('.detail-images img').forEach(img => {
        img.addEventListener('click', () => {
          openImageViewer(img.src);
        });
      });
      detailContent.querySelector('.detail-image')?.addEventListener('click', () => {
        openImageViewer(memory.images[0]);
      });

      document.getElementById('detailModal').classList.add('active');
    }

    // 关闭详情
    function closeDetail() {
      document.getElementById('detailModal').classList.remove('active');
    }

    // 打开表单弹窗
    function openForm(memory = null) {
      const modal = document.getElementById('formModal');
      const title = document.getElementById('formModalTitle');
      const form = document.getElementById('memoryForm');

      if (memory) {
        editingId = memory.id;
        title.textContent = '编辑记忆';
        document.getElementById('memoryId').value = memory.id;
        document.getElementById('memoryTitle').value = memory.title;
        document.getElementById('memoryDate').value = memory.date;
        document.getElementById('memoryContent').value = memory.content;
        currentImages = [...(memory.images || [])];
      } else {
        editingId = null;
        title.textContent = '添加记忆';
        form.reset();
        document.getElementById('memoryId').value = '';
        currentImages = [];
        // 默认日期为今天
        document.getElementById('memoryDate').value = new Date().toISOString().split('T')[0];
      }

      renderImagePreview();
      modal.classList.add('active');
    }

    // 关闭表单弹窗
    function closeForm() {
      document.getElementById('formModal').classList.remove('active');
      editingId = null;
      currentImages = [];
    }

    // 渲染图片预览
    function renderImagePreview() {
      const preview = document.getElementById('imagePreview');
      preview.innerHTML = currentImages.map((img, i) => `
        <div class="preview-item" style="background-image:url(${img});background-size:cover;background-position:center;">
          <button class="preview-remove" data-index="${i}">×</button>
        </div>
      `).join('');

      preview.querySelectorAll('.preview-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const index = parseInt(btn.dataset.index);
          currentImages.splice(index, 1);
          renderImagePreview();
        });
      });
    }

    // 处理图片上传
    function handleImageUpload(files) {
      const remaining = 9 - currentImages.length;
      const toProcess = Array.from(files).slice(0, remaining);

      toProcess.forEach(file => {
        if (!file.type.startsWith('image/')) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          currentImages.push(e.target.result);
          renderImagePreview();
        };
        reader.readAsDataURL(file);
      });
    }

    // 保存记忆
    function saveMemory() {
      const title = document.getElementById('memoryTitle').value.trim();
      const date = document.getElementById('memoryDate').value;
      const content = document.getElementById('memoryContent').value.trim();

      if (!title || !date || !content) {
        alert('请填写标题、日期和内容');
        return;
      }

      const now = Date.now();

      if (editingId) {
        // 编辑
        const index = memories.findIndex(m => m.id === editingId);
        if (index !== -1) {
          memories[index] = {
            ...memories[index],
            title,
            date,
            content,
            images: currentImages,
            updatedAt: now
          };
        }
      } else {
        // 新增
        const newMemory = {
          id: generateId(),
          title,
          date,
          content,
          images: currentImages,
          createdAt: now,
          updatedAt: now
        };
        memories.unshift(newMemory);
      }

      saveMemories();
      renderMemories();
      closeForm();
    }

    // 图片查看器
    function openImageViewer(src) {
      document.getElementById('viewerImage').src = src;
      document.getElementById('imageViewer').classList.add('active');
    }

    function closeImageViewer() {
      document.getElementById('imageViewer').classList.remove('active');
    }

    // 事件绑定
    document.getElementById('addBtn').onclick = () => openForm();
    document.getElementById('emptyAddBtn').onclick = () => openForm();
    document.getElementById('formModalClose').onclick = closeForm;
    document.getElementById('formCancelBtn').onclick = closeForm;
    document.getElementById('formSaveBtn').onclick = saveMemory;
    document.getElementById('detailModalClose').onclick = closeDetail;
    document.getElementById('imageViewerClose').onclick = closeImageViewer;

    // 图片上传
    document.getElementById('imageUpload').onclick = () => {
      document.getElementById('imageInput').click();
    };

    document.getElementById('imageInput').onchange = (e) => {
      handleImageUpload(e.target.files);
      e.target.value = '';
    };

    // 拖拽上传
    document.getElementById('imageUpload').ondragover = (e) => {
      e.preventDefault();
      e.currentTarget.style.borderColor = 'var(--color-primary)';
    };

    document.getElementById('imageUpload').ondragleave = (e) => {
      e.currentTarget.style.borderColor = '';
    };

    document.getElementById('imageUpload').ondrop = (e) => {
      e.preventDefault();
      e.currentTarget.style.borderColor = '';
      handleImageUpload(e.dataTransfer.files);
    };

    // 点击遮罩关闭弹窗
    document.getElementById('formModal').onclick = (e) => {
      if (e.target.id === 'formModal') closeForm();
    };

    document.getElementById('detailModal').onclick = (e) => {
      if (e.target.id === 'detailModal') closeDetail();
    };

    document.getElementById('imageViewer').onclick = (e) => {
      if (e.target.id === 'imageViewer') closeImageViewer();
    };

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeForm();
        closeDetail();
        closeImageViewer();
      }
    });

    // 初始化
    loadMemories();
  </script>
</body>
</html>
